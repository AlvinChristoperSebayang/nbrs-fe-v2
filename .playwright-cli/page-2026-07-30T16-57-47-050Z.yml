  - article [ref=f3e11]:
    - generic [ref=f3e15]:
      - heading "Design for good" [level=1] [ref=f3e16]
      - paragraph [ref=f3e18]: NBRS partakes in several social initiatives bringing smiles to communities in need and helping to positively shape their lives with designs that provide opportunities for a better future.
    - generic [ref=f3e20]:
      - generic [ref=f3e21]:
        - heading "Te-Kworo Foundation" [level=2] [ref=f3e22]
        - paragraph [ref=f3e24]: NBRS provides design for good expertise to support vulnerable communities in Northern Uganda.\n\nEstablished by Alice Achan in 2002, Te-Kworo Foundation delivers education, maternal and child healthcare, and social protection for girls and women.\n\nIn partnership with the Sonic Healthcare Foundation and the Barbara May Foundation, NBRS designed a 42-bed maternal health facility.
      - img "Te-Kworo Foundation" [ref=f3e26]
    - generic [ref=f3e27]:
      - generic [ref=f3e29]:
        - img "Architects Without Frontiers (AWF)" [ref=f3e32]
        - article [ref=f3e33]:
          - heading "Architects Without Frontiers (AWF)" [level=2] [ref=f3e34]
          - paragraph [ref=f3e36]: NBRS collaborates closely with AWF, the Asia-Pacific's leading not-for-profit design organisation. AWF delivers community infrastructure for disadvantaged regions.\n\nOur partnership includes the San Miguel National High School in the Philippines and the Home of Hope campus in India for One Life to Love.
      - generic [ref=f3e38]:
        - img "One Life to Love" [ref=f3e41]
        - article [ref=f3e42]:
          - heading "One Life to Love" [level=2] [ref=f3e43]
          - paragraph [ref=f3e45]: Through AWF, NBRS supports One Life to Love, a not-for-profit dedicated to the care and education of abandoned and at-risk children in India.\n\nNBRS has designed a campus in Bangalore housing orphans, neglected families, a school and a skills centre. Construction is starting in 2026.
    - generic [ref=f3e46]:
